# Sets the number of worker processes; 'auto' is a good default.
worker_processes auto;

events {
    # The maximum number of simultaneous connections that can be opened by a worker process.
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    types {
        application/javascript mjs;
    }

    # Docker's embedded DNS. Needed to resolve service hostnames at request
    # time (every proxy_pass below uses a variable) so nginx can start while any
    # service container is stopped or not yet created, and pick up its new IP
    # after it restarts.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    # General performance and security settings
    sendfile        on;
    keepalive_timeout  65;
    # It's good practice to hide the Nginx version number.
    server_tokens      off;

    # =================================================================
    #  1. Upstream Services
    # =================================================================
    # # Using upstream blocks is a great practice for organization and load balancing.

    # upstream auth_backend {
    #     # Points to the service defined in your docker-compose.yml
    #     server auth:8000;
    # }
    # # chat is not defined as an upstream block: a static `server chat:8000;`
    # # is resolved once at startup and nginx refuses to start if chat is down.
    # # It is resolved at request time via a variable in /api/chat/ instead.
    # upstream food_detect_backend {
    #     server food_detect:8000;
    # }
    # upstream fraud_backend {
    #     server fraud:8000;
    # }
    # upstream push_notification_backend {
    #     server push_notification:8000;
    # }
    # upstream notify_backend {
    #     server notify:8000;
    # }

    # Deliberately NOT `upstream {}` blocks: a static `server host:port;` is
    # resolved once at startup and nginx refuses to start ("host not found in
    # upstream") if that container is down or does not exist yet. Each location
    # below uses `set $x host:8000; proxy_pass http://$x;` so the name is
    # resolved per request via `resolver`. Requests return 502 until the
    # service is up.

    # =================================================================
    #  2. Main Server Block (The Router)
    # =================================================================
    server {
        listen 80;
        server_name localhost; # Replace with your domain in production

        # --- Location for Web Interface (Flutter Frontend) ---
        # location / {
        #     root /usr/share/nginx/html;
        #     index index.html;
        #     try_files $uri $uri/ /index.html;

        #     # Required for Flutter WASM multithreading
        #     add_header Cross-Origin-Opener-Policy same-origin always;
        #     add_header Cross-Origin-Embedder-Policy credentialless always;

        #     # Optional but recommended
        #     add_header Cross-Origin-Resource-Policy same-origin always;
        # }

        # --- Location for Web Interface (www service) ---
        # location /web/ {
        #     proxy_pass http://www_backend;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # }

        # --- Location for Authenticated REST APIs ---
        # This acts as a parent block for all /api/ traffic.
        location /api/ {
            # Step 1: All requests to /api/ must first be validated.
            auth_request /_validate_token;

            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $email $upstream_http_x_email;

            # Step 3: Inject headers into backend request
            proxy_set_header X-User-ID $user_id;
            proxy_set_header X-Email $email;
            # Pass the installation ID from the client's request for API calls too.
            proxy_set_header X-Installation-ID $http_x_installation_id;
            # Standard proxy headers for all API services
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # CORS headers for cross-origin requests
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";

            # --- Auth endpoints: no token validation (service handles its own auth) ---
            location /api/auth/ {
                auth_request off;
                set $auth_backend auth:8000;
                proxy_pass http://$auth_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header Cookie $http_cookie;
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            }

            # Using nested locations to route specific API calls
            location /api/chat/ {
                set $chat_backend chat:8000;
                proxy_pass http://$chat_backend;
                # CRITICAL: Disable buffering for any streaming responses from this service.
                proxy_buffering off;
                proxy_connect_timeout 5s;
            }
            location /api/fraud/ {
                set $fraud_backend fraud:8000;
                proxy_pass http://$fraud_backend;
                # CRITICAL: Disable buffering for any streaming responses from this service.
                proxy_buffering off;
            }
            location /api/food-recognition/ {
                set $food_detect_backend food_detect:8000;
                proxy_pass http://$food_detect_backend;
                # Allow larger file uploads for images
                client_max_body_size 50M;
            }
            # LINE account binding. Only /api/notify/line/ is exposed; the
            # notify service's /internal/* API has no route here on purpose.
            location /api/notify/line/ {
                set $notify_backend notify:8000;
                proxy_pass http://$notify_backend;
            }
            # LINE redirects the browser here without a token.
            location = /api/notify/line/callback {
                auth_request off;
                set $notify_backend notify:8000;
                proxy_pass http://$notify_backend;
            }
            location /api/push/events/ {
                # SSE requires unbuffered streaming and long timeouts
                set $push_notification_backend push_notification:8000;
                proxy_pass http://$push_notification_backend;
                proxy_buffering off;

                # Disable timeouts for long-lived SSE connections
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
                proxy_connect_timeout 30s;

                # Keep connection alive
                keepalive_timeout 3600s;

                # Ensure client connection stays open
                send_timeout 3600s;
            }
            location /api/push/ {
                set $push_notification_backend push_notification:8000;
                proxy_pass http://$push_notification_backend;
            }
        }

        # Notify endpoints (outside /api/ to avoid auth requirement)
        location /notify {
            set $push_notification_backend push_notification:8000;
            proxy_pass http://$push_notification_backend;
            # Allow larger body for notifications
            client_max_body_size 10M;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # --- Internal-Only Location for Token Validation ---
        location = /_validate_token {
            internal; # This location cannot be accessed from the outside world.
            proxy_pass_request_body off;
            client_max_body_size 50M;
            set $auth_backend auth:8000;
            proxy_pass http://$auth_backend/auth/validate;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization; # Pass the JWT to the auth service
        }

        # --- Custom Error Handling for Authentication Failures ---
        error_page 401 403 = @unauthorized;
        location @unauthorized {
            # Provides a consistent JSON error response on auth failure.
            default_type application/json;
            return 401 '{"status": "error", "message": "Unauthorized: Invalid or missing token."}';

            # CORS headers for error responses
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        }
    }
}
