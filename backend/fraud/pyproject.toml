[project]
name = "fraud"
version = "0.1.0"
description = "Anti-fraud communication service with GPT-powered conversation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.128.0",
    "setuptools>=80.9.0",
    "uvicorn>=0.40.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    # Database dependencies
    "asyncpg>=0.31.0",
    "redis>=7.1.0",
    "grpcio>=1.80.0",
    "numpy>=2.4.4",
    "realtimestt>=1.0.0",
    "python-dotenv>=1.2.2",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "grpcio-tools>=1.80.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"
