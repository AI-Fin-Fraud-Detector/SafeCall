[project]
name = "fraud"
version = "0.1.0"
description = "Anti-fraud communication service with GPT-powered conversation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.128.0",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "httpx>=0.28.1",
    "numpy>=2.4.4",
    "openai>=2.15.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.21",
    "realtimestt[faster-whisper]>=1.0.0",
    "redis>=7.1.0",
    "setuptools>=80.9.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "uvicorn>=0.40.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

