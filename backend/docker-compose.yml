services:
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
      args:
        - NONROOT_USERNAME=ubuntu
        - PROJECT_PATH=/project/auth
    restart: on-failure
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      PROJECT_PATH: /project/auth
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://localhost:8000/health'); exit(0 if response.status in (200, 201, 202) else 1)"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s
  db:
    image: postgres:18-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/18/docker
      - ./db/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE_NAME}"]
      interval: 30s
      retries: 5
      start_period: 2s
  db-migrate:
    image: postgres:18-alpine
    restart: "no"
    volumes:
      - ./db:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      PGHOST: db
      PGPORT: ${DB_PORT:-5432}
      PGUSER: ${DB_USERNAME}
      PGDATABASE: ${DB_DATABASE_NAME}
    command: >
      sh -c "
        for f in /migrations/*.sql; do
          echo \"Running migration: $$f\";
          psql -f \"$$f\";
        done;
        echo 'All migrations complete';
      "
  chat:
    build:
      context: chat
      target: prod
      dockerfile: Dockerfile
      args:
        - NONROOT_USERNAME=ubuntu
        - PROJECT_PATH=/project/chat
      secrets:
        - HF_TOKEN
        - GIT_AUTH_TOKEN
    restart: on-failure
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      OPENAI_VOICE_MODEL: ${OPENAI_VOICE_MODEL:-alloy}
      FOOD_API_URL: ${FOOD_API_URL}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    healthcheck:
      # test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "http.server", "8000"]
  fraud:
    build:
      context: fraud
      dockerfile: Dockerfile
      args:
        - NONROOT_USERNAME=ubuntu
        - PROJECT_PATH=/project/fraud
        - WHISPER_MODEL=${WHISPER_MODEL}
      secrets:
        - HF_TOKEN
    restart: on-failure
    ports:
      - "60015:60015"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      FRAUD_DETECTION_API_URL: ${FRAUD_DETECTION_API_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      OPENAI_VOICE_MODEL: ${OPENAI_VOICE_MODEL:-alloy}
      USE_SUPERTONIC_TTS: ${USE_SUPERTONIC_TTS}
      SUPERTONIC_VOICE: ${SUPERTONIC_VOICE}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      push_notification:
        condition: service_started
      redis:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://localhost:8000/health'); exit(0 if response.status in (200, 201, 202) else 1)"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 120s
  food_detect:
    build:
      context: ./food_detect
      dockerfile: Dockerfile
      args:
        - NONROOT_USERNAME=ubuntu
        - PROJECT_PATH=/project/food_detect
    depends_on:
      db:
        condition: service_healthy
  push_notification:
    build:
      context: ./push_notification
      dockerfile: Dockerfile
      args:
        - NONROOT_USERNAME=ubuntu
        - PROJECT_PATH=/project/push_notification
    restart: on-failure
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      FIREBASE_CREDENTIALS_PATH: /run/secrets/FCM_CREDENTIALS
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_EMAIL: ${VAPID_EMAIL}
    secrets:
      - FCM_CREDENTIALS
    depends_on:
      db:
        condition: service_healthy
  redis:
    image: redis:8-alpine
    restart: on-failure
  nginx:
    image: nginx:stable-alpine
    restart: on-failure
    ports:
      - "8100:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth:
        condition: service_healthy
      chat:
        condition: service_healthy
      fraud:
        condition: service_healthy

volumes:
  pg_data:

secrets:
  HF_TOKEN:
    environment: HF_TOKEN
  GIT_AUTH_TOKEN:
    environment: GIT_AUTH_TOKEN
  FCM_CREDENTIALS:
    file: ./secrets/firebase-key.json
